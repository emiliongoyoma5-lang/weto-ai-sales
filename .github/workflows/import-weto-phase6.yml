name: Import Weto AI Sales source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          test -f weto-ai-sales-v6-phase6.zip
          unzip -q -o weto-ai-sales-v6-phase6.zip -d .
          rm weto-ai-sales-v6-phase6.zip

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: import Weto AI Sales phase 6 source"
          git push
